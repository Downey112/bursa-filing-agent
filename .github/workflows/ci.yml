name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  eval:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Offline: several company sites block cloud IPs, so CI reads the statement pages saved
      # by eval/snapshot.py instead of downloading the PDFs.
      - name: Extraction eval (rules only; fails if wrong numbers are reported as ok)
        run: python eval/run_eval.py --offline
      - if: always()
        run: test -f EVAL.md && cat EVAL.md >> "$GITHUB_STEP_SUMMARY" || true
