name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # weekly: re-download the filings and re-run the eval
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  eval:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: filings/pdf
          key: filings-${{ hashFiles('filings/registry.yaml') }}
      - run: pip install -r requirements.txt
      - name: Extraction eval (rules only; fails if wrong numbers are reported as ok)
        run: python eval/run_eval.py
      - if: always()
        run: test -f EVAL.md && cat EVAL.md >> "$GITHUB_STEP_SUMMARY" || true
